services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opendhu
      POSTGRES_PASSWORD: opendhu
      POSTGRES_DB: opendhu
    ports:
      - "55432:5432"
    volumes:
      - opendhu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendhu -d opendhu"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://opendhu:opendhu@db:5432/opendhu
      READER_BIND: 0.0.0.0:8790
      READER_DATA_DIR: /data
      READER_JWT_SECRET: ${READER_JWT_SECRET:-change-me}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-text-embedding-3-small}
    ports:
      - "8790:8790"
    volumes:
      - opendhu-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  opendhu-db-data:
  opendhu-data:
